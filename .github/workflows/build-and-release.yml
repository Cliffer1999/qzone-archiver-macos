name: Build & Release macOS

on:
  push:
    branches:
      - main
    paths:
      - 'scripts/**'
      - '.github/workflows/build-and-release.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  UPSTREAM_COMMIT: 63967a184b44ea3eaf339f0abac72bb5244c0a75
  RELEASE_TAG: v4.0.0-mac.2

jobs:
  build:
    name: Build macOS ${{ matrix.arch }}
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        arch:
          - arm64
          - x64

    steps:
      - name: Checkout macOS port
        uses: actions/checkout@v4
        with:
          path: port

      - name: Checkout upstream qzone-archiver
        uses: actions/checkout@v4
        with:
          repository: salt-fishes/qzone-archiver
          ref: ${{ env.UPSTREAM_COMMIT }}
          path: upstream

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Apply macOS compatibility layer
        run: node port/scripts/apply-macos-port.mjs upstream

      - name: Install dependencies
        working-directory: upstream/desktop
        run: npm install --no-audit --no-fund

      - name: Build renderer
        working-directory: upstream/desktop
        run: npm run build:renderer

      - name: Package DMG and ZIP
        working-directory: upstream/desktop
        run: npx electron-builder --mac --${{ matrix.arch }}

      - name: Verify application code signature
        working-directory: upstream/desktop
        run: |
          APP_PATH="$(find release -maxdepth 2 -type d -name 'QZoneArchiver.app' -print -quit)"
          if [ -z "$APP_PATH" ]; then
            echo 'QZoneArchiver.app was not produced'
            exit 1
          fi
          echo "Verifying $APP_PATH"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          codesign -dv --verbose=4 "$APP_PATH" 2>&1

      - name: List packages
        working-directory: upstream/desktop
        run: find release -maxdepth 2 -type f -print

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: QZoneArchiver-macOS-${{ matrix.arch }}
          path: |
            upstream/desktop/release/*.dmg
            upstream/desktop/release/*.zip
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish public download
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download built packages
        uses: actions/download-artifact@v4
        with:
          pattern: QZoneArchiver-macOS-*
          path: release-assets
          merge-multiple: true

      - name: Show release files
        run: find release-assets -maxdepth 1 -type f -print

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "QZone Archiver for macOS v4.0.0-mac.2" \
            --latest \
            --notes $'🍎 QZone Archiver for macOS\n\n修复 Apple Silicon 上可能出现的“应用已损坏，无法打开”问题。此版本对生成的 macOS App 使用 ad-hoc code signing，并在 CI 中执行 codesign 完整性校验。\n\n### 下载哪个？\n- M1 / M2 / M3 / M4：下载文件名带 `arm64.dmg`\n- Intel Mac：下载文件名带 `x64.dmg`\n\n### 第一次启动\n本项目仍未使用付费 Apple Developer ID 进行公证，因此 Gatekeeper 可能提示开发者无法验证。请在 Finder 中右键 App → 打开，或前往系统设置 → 隐私与安全性 → 仍要打开。\n\n删除说说恢复依赖 QQ 空间仍然保留的点赞、评论等互动记录，并非所有已删除内容都能恢复。'

      - name: Upload DMG and ZIP to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$RELEASE_TAG" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
