name: Build & Release macOS

on:
  push:
    branches:
      - main
    paths:
      - 'scripts/**'
      - '.github/workflows/build-and-release.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  UPSTREAM_COMMIT: 63967a184b44ea3eaf339f0abac72bb5244c0a75
  RELEASE_TAG: v4.0.0-mac.4

jobs:
  build:
    name: Build macOS ${{ matrix.arch }}
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        arch:
          - arm64
          - x64

    steps:
      - name: Checkout macOS port
        uses: actions/checkout@v4
        with:
          path: port

      - name: Checkout upstream qzone-archiver
        uses: actions/checkout@v4
        with:
          repository: salt-fishes/qzone-archiver
          ref: ${{ env.UPSTREAM_COMMIT }}
          path: upstream

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Apply macOS compatibility layer
        run: node port/scripts/apply-macos-port.mjs upstream

      - name: Apply deleted-post recovery fixes
        run: node port/scripts/fix-recovery.mjs upstream

      - name: Install dependencies
        working-directory: upstream/desktop
        run: npm install --no-audit --no-fund

      - name: Build renderer
        working-directory: upstream/desktop
        run: npm run build:renderer

      - name: Package DMG and ZIP
        working-directory: upstream/desktop
        run: npx electron-builder --mac --${{ matrix.arch }}

      - name: Verify application code signature
        working-directory: upstream/desktop
        run: |
          APP_PATH="$(find release -maxdepth 2 -type d -name 'QZoneArchiver.app' -print -quit)"
          if [ -z "$APP_PATH" ]; then
            echo 'QZoneArchiver.app was not produced'
            exit 1
          fi
          echo "Verifying $APP_PATH"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          codesign -dv --verbose=4 "$APP_PATH" 2>&1

      - name: List packages
        working-directory: upstream/desktop
        run: find release -maxdepth 2 -type f -print

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: QZoneArchiver-macOS-${{ matrix.arch }}
          path: |
            upstream/desktop/release/*.dmg
            upstream/desktop/release/*.zip
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish public download
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download built packages
        uses: actions/download-artifact@v4
        with:
          pattern: QZoneArchiver-macOS-*
          path: release-assets
          merge-multiple: true

      - name: Show release files
        run: find release-assets -maxdepth 1 -type f -print

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "QZone Archiver for macOS v4.0.0-mac.4" \
            --latest \
            --notes $'🍎 QZone Archiver for macOS\n\n本版本重点修复“恢复已删除说说”的完整性和图片问题。\n\n### 修复内容\n- 移除错误的 1000 万条互动消息总数二分探测，不再出现 333334 页这种假进度。\n- 改为从第 1 页开始顺序向历史深处扫描，直到 QQ 接口真正返回空数据或重复页。\n- 一次响应如果包含多条 `<li>` 互动记录，现在会逐条解析；旧版只取第一条，会大量漏数据。\n- 遇到 QQ 风控/临时接口异常时，对同一页退避重试，不再像旧版一样第 8 页出错后直接放弃后面的历史。\n- 恢复结果会记录扫描到的最早互动日期，方便判断 QQ 服务器实际保留到了哪一年。\n- 恢复说说中的图片会加入本地下载队列，网页优先使用本地图片；即使某张旧图已被 QQ 清理，文字恢复仍会保留。\n- 保留 mac.3 的整体进度条修复与 mac.2 的 Apple Silicon code signing 修复。\n\n### 下载哪个？\n- M1 / M2 / M3 / M4：下载文件名带 `arm64.dmg`\n- Intel Mac：下载文件名带 `x64.dmg`\n\n注意：软件现在会尽可能完整扫描 QQ 仍提供的互动历史，但 QQ 服务器已经彻底清理的互动或媒体无法凭空恢复，因此不能保证一定覆盖账号全部 15 年历史。'

      - name: Upload DMG and ZIP to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$RELEASE_TAG" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
