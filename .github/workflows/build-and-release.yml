name: Build & Release macOS

on:
  push:
    branches:
      - main
    paths:
      - 'scripts/**'
      - '.github/workflows/build-and-release.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  UPSTREAM_COMMIT: 63967a184b44ea3eaf339f0abac72bb5244c0a75
  RELEASE_TAG: v4.0.0-mac.1

jobs:
  build:
    name: Build macOS ${{ matrix.arch }}
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        arch:
          - arm64
          - x64

    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'

    steps:
      - name: Checkout macOS port
        uses: actions/checkout@v4
        with:
          path: port

      - name: Checkout upstream qzone-archiver
        uses: actions/checkout@v4
        with:
          repository: salt-fishes/qzone-archiver
          ref: ${{ env.UPSTREAM_COMMIT }}
          path: upstream

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Apply macOS compatibility layer
        run: node port/scripts/apply-macos-port.mjs upstream

      - name: Install dependencies
        working-directory: upstream/desktop
        run: npm install --no-audit --no-fund

      - name: Build renderer
        working-directory: upstream/desktop
        run: npm run build:renderer

      - name: Package DMG and ZIP
        working-directory: upstream/desktop
        run: npx electron-builder --mac --${{ matrix.arch }}

      - name: List packages
        working-directory: upstream/desktop
        run: find release -maxdepth 2 -type f -print

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: QZoneArchiver-macOS-${{ matrix.arch }}
          path: |
            upstream/desktop/release/*.dmg
            upstream/desktop/release/*.zip
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish public download
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download built packages
        uses: actions/download-artifact@v4
        with:
          pattern: QZoneArchiver-macOS-*
          path: release-assets
          merge-multiple: true

      - name: Show release files
        run: find release-assets -maxdepth 1 -type f -print

      - name: Create release if needed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "QZone Archiver for macOS v4.0.0-mac.1" \
              --latest \
              --notes $'🍎 QZone Archiver for macOS\n\n免费、开源的 QQ 空间本地备份与已删除说说恢复工具。\n\n### 下载哪个？\n- M1 / M2 / M3 / M4：下载文件名带 `arm64.dmg`\n- Intel Mac：下载文件名带 `x64.dmg`\n\n### 提醒\n当前构建未使用 Apple Developer 证书签名。首次启动如被 Gatekeeper 阻止，请在 Finder 中右键 App → 打开。\n\n删除说说恢复依赖 QQ 空间仍然保留的点赞、评论等互动记录，并非所有已删除内容都能恢复。'
          fi

      - name: Upload DMG and ZIP to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$RELEASE_TAG" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
