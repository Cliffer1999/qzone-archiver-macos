name: Build & Release macOS

on:
  push:
    branches:
      - main
    paths:
      - 'scripts/**'
      - '.github/workflows/build-and-release.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  UPSTREAM_COMMIT: 63967a184b44ea3eaf339f0abac72bb5244c0a75
  RELEASE_TAG: v4.0.0-mac.3

jobs:
  build:
    name: Build macOS ${{ matrix.arch }}
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        arch:
          - arm64
          - x64

    steps:
      - name: Checkout macOS port
        uses: actions/checkout@v4
        with:
          path: port

      - name: Checkout upstream qzone-archiver
        uses: actions/checkout@v4
        with:
          repository: salt-fishes/qzone-archiver
          ref: ${{ env.UPSTREAM_COMMIT }}
          path: upstream

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Apply macOS compatibility layer
        run: node port/scripts/apply-macos-port.mjs upstream

      - name: Install dependencies
        working-directory: upstream/desktop
        run: npm install --no-audit --no-fund

      - name: Build renderer
        working-directory: upstream/desktop
        run: npm run build:renderer

      - name: Package DMG and ZIP
        working-directory: upstream/desktop
        run: npx electron-builder --mac --${{ matrix.arch }}

      - name: Verify application code signature
        working-directory: upstream/desktop
        run: |
          APP_PATH="$(find release -maxdepth 2 -type d -name 'QZoneArchiver.app' -print -quit)"
          if [ -z "$APP_PATH" ]; then
            echo 'QZoneArchiver.app was not produced'
            exit 1
          fi
          echo "Verifying $APP_PATH"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          codesign -dv --verbose=4 "$APP_PATH" 2>&1

      - name: List packages
        working-directory: upstream/desktop
        run: find release -maxdepth 2 -type f -print

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: QZoneArchiver-macOS-${{ matrix.arch }}
          path: |
            upstream/desktop/release/*.dmg
            upstream/desktop/release/*.zip
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish public download
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download built packages
        uses: actions/download-artifact@v4
        with:
          pattern: QZoneArchiver-macOS-*
          path: release-assets
          merge-multiple: true

      - name: Show release files
        run: find release-assets -maxdepth 1 -type f -print

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "QZone Archiver for macOS v4.0.0-mac.3" \
            --latest \
            --notes $'🍎 QZone Archiver for macOS\n\n本版本修复备份页进度条语义错误：上游每个子步骤都会单独上报 0–100%，旧界面却把它直接显示成整个备份进度，导致 100% 后又回到 0%。\n\n现在主进度条显示整体备份进度（只增不减），当前子步骤百分比单独显示；真正收到备份完成事件后才显示 100%。\n\n同时保留 mac.2 的 Apple Silicon ad-hoc code signing 与 codesign 完整性校验。\n\n### 下载哪个？\n- M1 / M2 / M3 / M4：下载文件名带 `arm64.dmg`\n- Intel Mac：下载文件名带 `x64.dmg`\n\n删除说说恢复仍属于实验性功能，恢复能力取决于 QQ 空间仍保留的互动数据。'

      - name: Upload DMG and ZIP to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$RELEASE_TAG" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
